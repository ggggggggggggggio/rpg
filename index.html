<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #20180e; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  .ui { position: fixed; z-index: 5; padding: 7px 14px; border: 1px solid rgba(160,135,80,0.55); border-radius: 2px;
        background: linear-gradient(#1c1915, #0e0c0a); color: #d8ccb0; font: 600 12px Cinzel, Georgia, serif;
        letter-spacing: 0.08em; box-shadow: 0 2px 8px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,230,180,0.06); }

  #modal .card .rar { position: absolute; top: 8px; right: 10px; font: 600 10px Cinzel, Georgia, serif; letter-spacing: 0.12em; text-transform: uppercase; }

  #modal .cbtns { display: flex; gap: 8px; justify-content: flex-end; }
  #modal .cbtns .ui { position: static; }
  #modal .ui.drop { color: #e08a7a; border-color: rgba(170,60,45,0.8); background: linear-gradient(#2a1210, #120706); }

  #modal .shopitem { display: flex; align-items: center; gap: 10px; }
  #modal .shopitem .ic { width: 34px; height: 34px; flex: none; border: 1px solid rgba(160,135,80,0.45); background: radial-gradient(circle at 50% 35%, #2a251f, #100d0b 75%); }

  #modal .slot.item { display: flex; align-items: center; justify-content: center; font: 600 8px Cinzel, Georgia, serif; letter-spacing: 0.04em; cursor: pointer; color: #d8ccb0; padding: 2px; }
  #modal .slot.item.on { border-color: rgba(220,190,120,0.95); box-shadow: inset 0 0 0 3px rgba(0,0,0,0.5), 0 0 8px rgba(200,170,100,0.35); color: #f0d890; }
  #modal .slot span { position: absolute; left: 4px; top: 2px; font: 10px Georgia, serif; opacity: 0.55; }

         border: 1px solid rgba(160,135,80,0.5); background: rgba(10,9,8,0.9); color: #d8ccb0; font: 12px Georgia, serif; display: none; }
  #modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
           background: radial-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.75)); }
  #modal .box { width: min(440px, 88vw); max-height: 86vh; overflow: auto; padding: 18px 22px 16px; box-sizing: border-box;
                background: linear-gradient(#18150f, #0b0907); border: 1px solid rgba(160,135,80,0.6); color: #d8ccb0;
                box-shadow: 0 12px 40px rgba(0,0,0,0.85), inset 0 0 0 4px rgba(0,0,0,0.55), inset 0 0 0 5px rgba(160,135,80,0.22);
                font: 14px Georgia, serif; text-align: center; }
  #modal .title { font: 700 19px Cinzel, Georgia, serif; letter-spacing: 0.14em; color: #e4d29c; }
  #modal .rule { height: 1px; margin: 9px auto 12px; width: 70%; background: linear-gradient(90deg, transparent, rgba(160,135,80,0.8), transparent); }
  #modal .body { line-height: 1.55; margin-bottom: 14px; }
  #modal .dim { opacity: 0.6; font-size: 12px; }
  #modal .btns { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }

  #modal .tab { opacity: 0.55; } #modal .tab.on { opacity: 1; color: #f0d890; }
  #modal .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; padding: 7px 4px;

  #modal .price { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; }

  /* inventory: a lighter, warmer bronze, rounded slots and raised metal buttons */
  #modal .box.invbox { background: radial-gradient(ellipse at 50% 0%, #4a3f2f, transparent 70%), linear-gradient(#3a3226, #29231a);
                       border-color: rgba(214,182,118,0.75); color: #eadfc4;
                       box-shadow: 0 14px 44px rgba(0,0,0,0.7), inset 0 0 0 4px rgba(20,15,10,0.45), inset 0 0 0 5px rgba(214,182,118,0.3); }
  #modal .invbox .title { color: #f3dfa6; text-shadow: 0 1px 0 #000, 0 0 12px rgba(240,200,120,0.25); }
  #modal .invbox .rule { margin: 8px auto 12px; background: linear-gradient(90deg, transparent, rgba(220,186,120,0.9), transparent); }
  #modal .invbox .hint { opacity: 0.6; color: #e2d4b2; }
  #modal .invbox .inv { gap: 14px; flex-wrap: wrap; }
  #modal .invbox .pane { padding: 9px 11px 5px; border: 1px solid rgba(214,182,118,0.32); border-radius: 6px;
                         background: linear-gradient(rgba(255,236,196,0.07), rgba(255,236,196,0.02)); box-shadow: inset 0 1px 0 rgba(255,236,196,0.08), 0 2px 6px rgba(0,0,0,0.25); }
  #modal .invbox .sub { opacity: 0.85; color: #e6cf94; }

                         background: radial-gradient(circle at 50% 30%, #5a4e3d, #352d22 80%);
                         box-shadow: inset 0 2px 5px rgba(0,0,0,0.45), inset 0 -1px 0 rgba(255,236,196,0.08), 0 1px 0 rgba(255,236,196,0.06); transition: border-color 0.12s, box-shadow 0.12s, transform 0.12s; }
  #modal .invbox .slot.item:hover { border-color: rgba(240,210,140,0.9); transform: translateY(-1px); }
  #modal .invbox .slot.item.on { border-color: rgba(246,214,138,1); box-shadow: inset 0 2px 5px rgba(0,0,0,0.4), 0 0 10px rgba(240,200,120,0.55); }
  #modal .invbox .slot.over { border-color: rgba(255,226,150,1); box-shadow: inset 0 2px 5px rgba(0,0,0,0.4), 0 0 12px rgba(250,215,140,0.7); }
  #modal .invbox .slot span { color: #eadfc4; opacity: 0.5; }
  #modal .invbox .slot.eqs { width: 34px; height: 34px; border-radius: 50%; }

  #modal .invbox .doll { width: 260px; height: 232px; }
  #modal .invbox .doll .wire { position: absolute; left: 0; top: 0; width: 260px; height: 232px; }

  #modal .invbox .doll .mc { left: 98px; top: 46px; width: 64px; height: 64px; border-color: #d6b676; box-shadow: 0 0 0 3px #2a2219, 0 0 0 4px rgba(214,182,118,0.4), 0 4px 12px rgba(0,0,0,0.5); }
  #modal .invbox .card { border-radius: 8px; background: linear-gradient(#44392a, #2c251b); border-color: rgba(214,182,118,0.85); color: #eadfc4;
                         box-shadow: 0 12px 32px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,236,196,0.12); }
  #modal .invbox .card .stats { color: #e2d6ba; border-top-color: rgba(214,182,118,0.3); }
  #modal .invbox .chead .ic { border-radius: 6px; background: radial-gradient(circle at 50% 30%, #5a4e3d, #352d22 80%); }
  #modal .invbox .cardwrap { background: rgba(20,15,10,0.45); border-radius: 2px; }
  #modal .invbox .ui { position: relative; padding: 8px 18px; border-radius: 6px; border: 1px solid #b8955a; color: #f6e6bc; font-size: 12px;
                       text-shadow: 0 1px 1px rgba(0,0,0,0.7); cursor: pointer;
                       background: linear-gradient(#6e5a3c, #4a3b26 55%, #3c3020);
                       box-shadow: inset 0 1px 0 rgba(255,232,180,0.35), inset 0 -2px 0 rgba(0,0,0,0.25), 0 2px 0 #1d160e, 0 4px 8px rgba(0,0,0,0.45);
                       transition: filter 0.12s, transform 0.08s, box-shadow 0.08s; }
  #modal .invbox .ui:hover { filter: brightness(1.15); }
  #modal .invbox .ui:active { transform: translateY(2px); box-shadow: inset 0 1px 3px rgba(0,0,0,0.5), 0 0 0 #1d160e; }
  #modal .invbox .ui.primary { color: #2b1d0c; border-color: #f2d48c; text-shadow: 0 1px 0 rgba(255,240,200,0.5);
                               background: linear-gradient(#f4dc9a, #d4ab5a 50%, #b48a3e); }
  #modal .invbox .ui.drop { color: #ffe3dc; border-color: #c46a58; background: linear-gradient(#a2463a, #7a2c22 55%, #5e1f18); }
  #modal .invbox .title .x { float: right; width: 30px; height: 30px; padding: 0; border-radius: 50%; font-size: 18px; line-height: 27px; text-align: center; }

<body>
<div id="nojs" style="position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#20180e;color:#d8ccb0;font:15px Georgia,serif;line-height:1.5">
  <div>The game can't run inside this preview.<br>Open it in a browser instead (on iPhone: open the game's link in Safari).</div>
</div>
<canvas id="c"></canvas>
<button id="fs" class="ui">⛶ Fullscreen</button>
<button id="settings" class="ui">Settings</button>
<div id="panel">
  <b>Camera zoom</b> <span id="zoomv" style="float:right"></span>
  <input id="zoomr" type="range" min="0.4" max="1.2" step="0.05">
  <div class="row"><span>Far</span><span>Close</span></div>
  <label><input id="hbox" type="checkbox"> Show hitboxes</label>
  <hr>
  <label><input id="demo" type="checkbox"> Demo mode (no cooldowns)</label>
  <label><input id="dmg20" type="checkbox"> 20x damage</label>
  <button id="clearwave" class="ui" style="position:static;margin-top:12px;width:100%">Clear wave</button>
  <button id="spawnbeast" class="ui" style="position:static;margin-top:8px;width:100%">Spawn black monster</button>
  <button id="giveclaw" class="ui" style="position:static;margin-top:8px;width:100%">Add Chasmfiend Claw</button>
  <hr>
  <b>Save</b> <span id="savedat" class="row" style="float:right;margin:0"></span>
  <button id="exportsave" class="ui" style="position:static;margin-top:8px;width:100%">Export save</button>
  <button id="importsave" class="ui" style="position:static;margin-top:8px;width:100%">Import save</button>
  <button id="newgame" class="ui" style="position:static;margin-top:8px;width:100%;color:#e08a7a">New game</button>
  <input id="savefile" type="file" accept=".json,application/json" style="display:none">
</div>
<div id="msg"></div>
<div id="modal"><div class="box"></div></div>
<script>
document.getElementById('nojs').remove();
if (!CanvasRenderingContext2D.prototype.roundRect) {   // older Safari (iOS 15 and earlier)
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (w < 0) { x += w; w = -w; } if (h < 0) { y += h; h = -h; }
    r = Math.max(0, Math.min(+r || 0, w / 2, h / 2));
    this.moveTo(x + r, y); this.lineTo(x + w - r, y); this.arcTo(x + w, y, x + w, y + r, r);
    this.lineTo(x + w, y + h - r); this.arcTo(x + w, y + h, x + w - r, y + h, r);
    this.lineTo(x + r, y + h); this.arcTo(x, y + h, x, y + h - r, r);
    this.lineTo(x, y + r); this.arcTo(x, y, x + r, y, r); this.closePath();
  };
}
let shownErr = false;
function showError(e) {   // if something breaks on a device, say what, instead of a blank screen
  if (shownErr) return; shownErr = true;
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:30;padding:10px 12px;background:rgba(14,12,10,0.94);border:1px solid rgba(160,135,80,0.6);color:#d8ccb0;font:12px Georgia,serif;white-space:pre-wrap';
  d.textContent = 'Error: ' + (e && (e.message || e)) + (e && e.stack ? '\n' + String(e.stack).split('\n').slice(0, 3).join('\n') : '');
  document.body.appendChild(d);
}
addEventListener('error', ev => showError(ev.error || ev.message));
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);
resize();

// ---------- Fullscreen ----------
const fsBtn = document.getElementById('fs'), msg = document.getElementById('msg');
// opened from the home-screen icon: already fullscreen, so no button; and register the offline helper when hosted
const asApp = (window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches)) || navigator.standalone;
if (asApp) fsBtn.style.display = 'none';
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
fsBtn.addEventListener('click', async () => {
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' });
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else throw new Error('unsupported');
    try { await screen.orientation.lock('landscape'); } catch (e) {}
  } catch (e) {
    msg.textContent = "Fullscreen is blocked here. Open the link directly in Chrome, or use Chrome menu > Add to Home screen.";
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 6000);
  }
});
document.addEventListener('fullscreenchange', () => {
  fsBtn.style.display = document.fullscreenElement ? 'none' : 'block';
  resize();
});

// ---------- Demo mode (no cooldowns) ----------
let demo = false;
// ---------- TEMPORARY: 20x damage switch, for testing the later waves ----------
let dmg20 = false;
document.getElementById('dmg20').addEventListener('change', e => dmg20 = e.target.checked);
document.getElementById('demo').addEventListener('change', e => demo = e.target.checked);
document.getElementById('clearwave').addEventListener('click', () => clearWave());
document.getElementById('spawnbeast').addEventListener('click', () => spawnBeastNear());
document.getElementById('giveclaw').addEventListener('click', () => popText(player.x, player.y - 84, addItem('claw') ? 'Chasmfiend Claw' : 'Inventory full', '#c9b98a', 14));   // TEMPORARY: for testing

// ---------- Settings ----------
let zoom = 0.65, camZoom = 0.65;
try { const z = parseFloat(localStorage.getItem('zoom')); if (z >= 0.4 && z <= 1.2) zoom = z; } catch (e) {}
const panel = document.getElementById('panel'), zr = document.getElementById('zoomr'), zv = document.getElementById('zoomv');
zr.value = zoom; zv.textContent = zoom.toFixed(2) + '×';
document.getElementById('settings').addEventListener('click', () => {
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
});
zr.addEventListener('input', () => {
  zoom = parseFloat(zr.value); zv.textContent = zoom.toFixed(2) + '×';
  try { localStorage.setItem('zoom', zoom); } catch (e) {}
});

let showHit = false;
document.getElementById('hbox').addEventListener('change', e => showHit = e.target.checked);
const FONT = '700 X "Cinzel", Georgia, serif';   // X = size
const font = px => FONT.replace('X', px + 'px');
const BONE = '#d9ceb2', GOLD = '#9c8550', GOLD_D = '#5e4e2c';

// ---------- World ----------
const WORLD = 2600, T = 16;
const FENCES1 = [
  // pen with a gate gap at the bottom
  { x: 600, y: 600, w: 300, h: T }, { x: 600, y: 600, w: T, h: 240 }, { x: 884, y: 600, w: T, h: 240 },
  { x: 600, y: 824, w: 110, h: T }, { x: 790, y: 824, w: 110, h: T },
  // L-shaped fences
  { x: 1700, y: 1500, w: 260, h: T }, { x: 1700, y: 1500, w: T, h: 350 },
  { x: 300, y: 1200, w: 250, h: T }, { x: 300, y: 1200, w: T, h: 200 },
  // extra pens in the new space
  { x: 1800, y: 1900, w: 300, h: T }, { x: 1800, y: 1900, w: T, h: 220 },
  { x: 400, y: 1900, w: T, h: 300 }, { x: 400, y: 1900, w: 220, h: T },
];
const fences = FENCES1.map(f => Object.assign({}, f));

// ---------- Map: painted ground + props ----------
const ground = document.createElement('canvas'); ground.width = ground.height = WORLD;
const props = [], solids = [];
const seeded = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); };
// roads as quadratic curves [x0,y0, cx,cy, x1,y1]

    const cy = Math.max(f.y, Math.min(y, f.y + f.h));

function drawBossTelegraphs() {

      ctx.beginPath(); ctx.roundRect(-60, -78, (650 + 210) * e, 156, 30); ctx.fillStyle = fill(0.16 + 0.2 * k); ctx.fill();

    ta = fa + (Math.cos(fa) >= 0 ? 0.95 : -0.95); tl = SW_ATTACK; thx = Math.cos(ta) * 14; thy = -12 + Math.sin(ta) * 10; k = 10;

// ---------- Greatbow ----------
// blackened-iron greatbow with gold inlay; looses arrows of ember light.
// tap = quick shot with slight homing (homing ramps up with distance flown, so it barely helps up close)
// hold = three charge stages, each a stronger, faster, more piercing arrow
const BOW_STAGE_T = [0.45, 0.95, 1.55];
const STAGE_COL = [[255, 168, 72], [255, 150, 60], [255, 206, 112], [255, 92, 44]];   // ember -> amber -> gold -> crimson flame
const ARROW = [
  { sp: 1150, dmg: 12, pierce: 0,  range: 950,  home: 5.5, rad: 3,  len: 30, kb: 0.35 },
  { sp: 1300, dmg: 24, pierce: 1,  range: 1050, home: 4.5, rad: 5,  len: 40, kb: 0.7 },
  { sp: 1450, dmg: 42, pierce: 3,  range: 1150, home: 3.8, rad: 7,  len: 54, kb: 1 },
  { sp: 1650, dmg: 260, pierce: 99, range: 1300, home: 3.0, rad: 10, len: 74, kb: 1.4, burst: true },
];
const bow = { charge: -1, stage: 0, raise: 0, pull: 0, kick: 0, vib: 0, ang: 0, shotT: 9, sig: 0 };
const arrows = [], motes = [], rings = [];
const bowCol = (st, a) => rgba(STAGE_COL[st], a);
const clamp01 = v => Math.max(0, Math.min(1, v));

function bowPose() {   // grip position relative to the player's centre
  const r = bow.raise, reach = lerp(11, 18, r) - bow.kick * 6;
  return { ang: bow.ang, hx: Math.cos(bow.ang) * reach, hy: lerp(-5, -12, r) + Math.sin(bow.ang) * reach * 0.7 };
}
function bowWorld() {
  const p = bowPose(), c = Math.cos(p.ang), s = Math.sin(p.ang), gx = player.x + p.hx, gy = player.y + p.hy, nx = -5 - bow.pull * 24;
  const tipX = nx + ARROW[bow.stage].len;

}
function stageUp(st) {
  const w = bowWorld();
  rings.push({ x: w.tip[0], y: w.tip[1], t: 0, st, R: 26 + st * 16 });
  for (let i = 0; i < 4 + st * 3; i++) spawnSpark(w.tip[0], w.tip[1], 120 + st * 40);
  shake = Math.max(shake, 0.05 + st * 0.07);
  if (st === 3) flash = Math.max(flash, 0.12);
}
function fireArrow(aim) {
  player.calmT = 0;
  const B = bow, st = B.stage, P = ARROW[st];
  B.ang = aim; B.raise = 1;
  const w = bowWorld();
  arrows.push({ x: w.tip[0], y: w.tip[1], ang: aim, st, sp: P.sp, dmg: P.dmg, pierce: P.pierce, range: P.range, home: P.home,
                rad: P.rad, len: P.len, kb: P.kb, burst: !!P.burst, dist: 0, hits: new Set(), trail: [], stuck: 0, dead: 0 });
  rings.push({ x: w.tip[0], y: w.tip[1], t: 0, st, R: 14 + st * 12 });
  for (let i = 0; i < 2 + st * 4; i++) spawnSpark(w.tip[0], w.tip[1], 90 + st * 60);
  if (st >= 2) moveEnt(player, -w.c * st * 7, -w.s * st * 7);   // recoil
  shake = Math.max(shake, [0.04, 0.1, 0.2, 0.4][st]);
  if (st === 3) { flash = Math.max(flash, 0.22); hitstop = Math.max(hitstop, 0.04); }
  B.charge = -1; B.stage = 0; B.pull = 0; B.kick = 1; B.vib = 1; B.shotT = 0;
  player.cool.atk = st ? 0.3 : 0.2;
}
function updateBow(dt, aim) {
  const B = bow, active = player.weapon === 'bow' && !player.thunder && !blade.out && !zapBusy();
  B.shotT += dt; B.kick = Math.max(0, B.kick - dt * 6); B.vib = Math.max(0, B.vib - dt * 3);
  if (!active) { B.charge = -1; B.stage = 0; }
  else {
    if (B.charge < 0 && (held.atk || tapped.atk) && player.cool.atk <= 0 && player.dashT <= 0) { B.charge = 0; B.stage = 0; }
    if (B.charge >= 0) {
      if (player.dashT > 0) { B.charge = -1; B.stage = 0; }            // dashing cancels the draw
      else if (held.atk) {
        B.charge += dt;
        const st = B.charge >= BOW_STAGE_T[2] ? 3 : B.charge >= BOW_STAGE_T[1] ? 2 : B.charge >= BOW_STAGE_T[0] ? 1 : 0;
        if (st > B.stage) { B.stage = st; stageUp(st); }
        let n = B.charge < 0.12 ? 0 : [14, 30, 48, 75][B.stage] * dt;   // motes of light drawn into the arrowhead
        while (Math.random() < n) {
          n -= 1;
          const w = bowWorld(), a = Math.random() * 6.283, r = 40 + Math.random() * 50;
          motes.push({ x: w.tip[0] + Math.cos(a) * r, y: w.tip[1] + Math.sin(a) * r * 0.8, life: 0, st: B.stage, spin: Math.random() < 0.5 ? -1 : 1 });
        }
        if (B.stage === 3 && Math.random() < dt * 14) { const w = bowWorld(); spawnSpark(w.tip[0], w.tip[1], 70); }
      } else fireArrow(aim);
    }
  }
  tapped.atk = false;
  const up = B.charge >= 0 || B.shotT < 0.6 ? 1 : 0;
  B.raise += (up - B.raise) * Math.min(1, dt * (up ? 22 : 6));
  const pullT = B.charge >= 0 ? Math.min(1, B.charge / 0.12) * 0.55 + 0.45 * Math.min(1, B.charge / BOW_STAGE_T[2]) : 0;
  B.pull += (pullT - B.pull) * Math.min(1, dt * 30);
  const ta = B.raise > 0.5 ? aim : aim + (Math.cos(aim) >= 0 ? 1.15 : -1.15);   // lowered at the side when idle
  B.ang += angDiff(ta, B.ang) * Math.min(1, dt * 16);
  const sigT = B.charge >= 0 ? [0.35, 1, 1.6, 2.3][B.stage] * Math.min(1, B.charge / 0.25) : 0;
  B.sig += (sigT - B.sig) * Math.min(1, dt * 10);

  const tip = bowWorld().tip;
  for (let i = motes.length - 1; i >= 0; i--) {
    const m = motes[i], dx = tip[0] - m.x, dy = tip[1] - m.y, d = Math.hypot(dx, dy);
    m.life += dt;
    m.x += (dx * 7 - dy * m.spin * 3) * dt; m.y += (dy * 7 + dx * m.spin * 3) * dt;

  }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t > 0.35) rings.splice(i, 1); }
}

function arrowBurst(x, y, ax, ay, skip) {   // stage 3 shockwave on first impact
  rings.push({ x, y, t: 0, st: 3, R: 110 });
  for (let i = 0; i < 16; i++) spawnSpark(x, y, 300);
  shake = Math.max(shake, 0.55); flash = Math.max(flash, 0.15);
  for (const z of zombies) if (z !== skip && !z.dying && Math.hypot(z.x - x, z.y - 4 - y) < 100 + z.r) {
    const dx = z.x - x, dy = z.y - y, d = Math.hypot(dx, dy) || 1; hurt(z, 30, dx / d, dy / d, 1.2);
  }
  destroyNear(x, y + 14, 90, ax, ay);
}
function updateArrows(dt) {
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i];
    if (a.stuck > 0) { a.stuck -= dt; if (a.stuck <= 0) arrows.splice(i, 1); continue; }
    if (a.dead > 0) { a.dead -= dt; if (a.dead <= 0) arrows.splice(i, 1); continue; }
    // homing strength ramps from 0 (first ~60px) to full (~300px): weak up close, reliable at range
    const k = clamp01((a.dist - 60) / 240);
    if (k > 0) {
      let best = null, bd = 650;
      for (const z of zombies) {
        if (z.dying || a.hits.has(z)) continue;
        const tx = z.x, ty = z.y - 4 * z.sc, d = Math.hypot(tx - a.x, ty - a.y);
        if (d < bd && Math.abs(angDiff(Math.atan2(ty - a.y, tx - a.x), a.ang)) < 0.85) { best = [tx, ty]; bd = d; }
      }
      if (best) { const turn = a.home * k * dt; a.ang += Math.max(-turn, Math.min(turn, angDiff(Math.atan2(best[1] - a.y, best[0] - a.x), a.ang))); }
    }
    const c = Math.cos(a.ang), s = Math.sin(a.ang), px = a.x, py = a.y, step = a.sp * dt;
    a.x += c * step; a.y += s * step; a.dist += step;

    // zombies: the swept segment this frame vs the same body circles the sword uses
    const sdx = a.x - px, sdy = a.y - py, l2 = sdx * sdx + sdy * sdy || 1;
    for (const z of zombies) {
      if (z.dying || a.hits.has(z)) continue;
      const b = zombieBody(z).find(q => segDist(q[0], q[1], px, py, a.x, a.y) < q[2] + a.rad);
      if (!b) continue;
      const u = clamp01(((b[0] - px) * sdx + (b[1] - py) * sdy) / l2), hx = px + sdx * u, hy = py + sdy * u;
      a.hits.add(z); hurt(z, a.dmg, c, s, a.kb);
      impacts.push({ x: hx, y: hy, a: a.ang, t: 0, c: STAGE_COL[a.st] });
      for (let j = 0; j < 3 + a.st * 2; j++) spawnSpark(hx, hy, 160 + a.st * 50);
      shake = Math.max(shake, 0.1 + a.st * 0.08);
      if (a.st >= 2) hitstop = Math.max(hitstop, 0.03 + a.st * 0.01);
      if (a.burst && !a.bursted) { a.bursted = true; arrowBurst(hx, hy, c, s, z); }
      if (--a.pierce < 0) { a.x = hx; a.y = hy; a.dead = 0.12; break; }
    }
    if (a.dead) continue;
    // world: arrows fly at chest height, so test the ground point beneath them
    const gx = a.x, gy = a.y + 14;
    let hitSolid = false;
    for (const o of props) {
      if (!o.solid || !(o.solids || [o.solid]).some(q => Math.hypot(gx - q.x, gy - q.y) <= q.r + 2)) continue;
      if (a.st === 3 && BREAK.has(o.k)) { destroyProp(o, c, s); continue; }
      hitSolid = true; break;
    }
    if (!hitSolid) hitSolid = walls.some(f => gx > f.x - 2 && gx < f.x + f.w + 2 && gy > f.y - 2 && gy < f.y + f.h + 2);   // stonework stops everything
    if (hitSolid) { /* fall through */ }
    else if (a.st === 3) { for (const f of fences.slice()) if (gx > f.x - 4 && gx < f.x + f.w + 4 && gy > f.y - 4 && gy < f.y + f.h + 4) breakFence(f, gx, gy, c, s); }
    else if (!hitSolid) hitSolid = fences.some(f => gx > f.x - 2 && gx < f.x + f.w + 2 && gy > f.y - 2 && gy < f.y + f.h + 2);
    if (hitSolid) {
      for (let j = 0; j < 4; j++) spawnSpark(a.x, a.y, 90);

}

// arrow body in local space: tip at (0,0), pointing +x
function drawArrowShape(len, st, al) {
  const c = STAGE_COL[st];
  ctx.lineCap = 'round';
  if (st === 0) {
    ctx.strokeStyle = `rgba(28,20,14,${al})`; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(-6, 0); ctx.stroke();
    ctx.fillStyle = `rgba(206,166,88,${al})`; ctx.beginPath(); ctx.moveTo(1, 0); ctx.lineTo(-8, -3.2); ctx.lineTo(-6, 0); ctx.lineTo(-8, 3.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = `rgba(110,30,18,${al})`;
    for (const m of [-1, 1]) { ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(-len + 8, 0); ctx.lineTo(-len + 4, 3.6 * m); ctx.lineTo(-len - 2, 3.6 * m); ctx.closePath(); ctx.fill(); }
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(c, 0.3 * al); ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(-len * 0.5, 0); ctx.lineTo(0, 0); ctx.stroke();
    ctx.restore();

  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  if (st === 3) { ctx.strokeStyle = `rgba(255,60,24,${0.2 * al})`; ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(4, 0); ctx.stroke(); }
  ctx.strokeStyle = rgba(c, 0.3 * al); ctx.lineWidth = 2 + st * 2.4; ctx.beginPath(); ctx.moveTo(-len, 0); ctx.lineTo(0, 0); ctx.stroke();
  ctx.strokeStyle = rgba(c, 0.75 * al); ctx.lineWidth = 1 + st; ctx.beginPath(); ctx.moveTo(-len * 0.85, 0); ctx.lineTo(0, 0); ctx.stroke();
  ctx.strokeStyle = `rgba(255,248,228,${al})`; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(-len * 0.7, 0); ctx.lineTo(0, 0); ctx.stroke();
  const h = 4 + st * 2;
  ctx.fillStyle = `rgba(255,244,214,${al})`; ctx.beginPath(); ctx.moveTo(h, 0); ctx.lineTo(-h * 0.7, -h * 0.55); ctx.lineTo(-h * 0.35, 0); ctx.lineTo(-h * 0.7, h * 0.55); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBow(x, y, ang, pull, glow, st, sc, vib, nocked) {
  const t = performance.now();
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(sc, sc);
  const LIMB = [[0, 0], [6, -10], [8.5, -22], [6, -34], [0, -43], [-5, -49]], TH = [7.5, 6.8, 5.8, 4.6, 3.4, 2.2];
  const sx = -5 - pull * 24, mid = Math.sin(t / 16) * vib * 3;
  const str = () => { ctx.beginPath(); ctx.moveTo(-5, -49); ctx.lineTo(sx, mid); ctx.lineTo(-5, 49); };
  str(); ctx.strokeStyle = 'rgba(232,218,184,0.85)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const m of [-1, 1]) {
    const P = LIMB.map(p => [p[0], p[1] * m]);
    for (const [extra, col] of [[2.2, '#09080a'], [0, '#29262d']]) {
      ctx.strokeStyle = col;
      for (let i = 0; i < P.length - 1; i++) { ctx.lineWidth = TH[i] + extra; ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[i + 1][0], P[i + 1][1]); ctx.stroke(); }
    }

    poly(-1.6); ctx.strokeStyle = 'rgba(150,140,165,0.3)'; ctx.lineWidth = 1; ctx.stroke();      // cold edge light
    poly(0.9); ctx.strokeStyle = '#b8913e'; ctx.lineWidth = 1.1; ctx.stroke();                   // gold inlay
    // thorns jutting forward, and a bladed tip
    const thorn = (b, tip, w) => {
      ctx.beginPath(); ctx.moveTo(b[0], b[1] - w); ctx.lineTo(tip[0], tip[1]); ctx.lineTo(b[0], b[1] + w); ctx.closePath();
      ctx.fillStyle = '#29262d'; ctx.fill(); ctx.strokeStyle = 'rgba(184,145,62,0.8)'; ctx.lineWidth = 0.7; ctx.stroke();
    };

    ctx.beginPath(); ctx.moveTo(-8, -45 * m); ctx.lineTo(-1, -61 * m); ctx.lineTo(3, -50 * m); ctx.lineTo(-3, -47 * m); ctx.closePath();
    ctx.fillStyle = '#1d1b20'; ctx.fill(); ctx.strokeStyle = '#b8913e'; ctx.lineWidth = 0.8; ctx.stroke();
    if (glow > 0) {   // ember veins wake up as the bow is drawn
      ctx.save(); ctx.globalCompositeOperation = 'lighter';

  ctx.fillStyle = '#c9a24a'; ctx.beginPath(); ctx.arc(4, 0, 4.4, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#4d3c1c'; ctx.lineWidth = 1; ctx.stroke();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = bowCol(st, 0.4 + Math.min(1, glow) * 0.6); ctx.beginPath(); ctx.arc(4, 0, 2.4, 0, 6.283); ctx.fill();
  if (glow > 0.3) { str(); ctx.strokeStyle = bowCol(st, 0.4 * Math.min(1, glow)); ctx.lineWidth = 3; ctx.stroke(); }
  ctx.restore();
  if (nocked) { ctx.save(); ctx.translate(sx + ARROW[st].len, 0); drawArrowShape(ARROW[st].len, st, 1); ctx.restore(); }
  ctx.restore();
}

function drawArrows() {
  for (const a of arrows) {
    const al = a.stuck > 0 ? Math.min(1, a.stuck / 0.5) : a.dead > 0 ? a.dead / 0.15 : 1, c = STAGE_COL[a.st];
    if (!a.stuck) {
      ctx.fillStyle = `rgba(0,0,0,${0.2 * al})`; ctx.beginPath();
      ctx.ellipse(a.x - Math.cos(a.ang) * a.len / 2, a.y + 26, a.len * 0.4, 2.2, a.ang * 0.15, 0, 6.283); ctx.fill();
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
      const n = a.trail.length - 1;
      for (let i = 0; i < n; i++) {
        const f = 1 - i / n;
        ctx.strokeStyle = rgba(c, (a.st ? 0.55 : 0.25) * f * al); ctx.lineWidth = (1 + a.st * 1.8) * f + 0.5;
        ctx.beginPath(); ctx.moveTo(a.trail[i][0], a.trail[i][1]); ctx.lineTo(a.trail[i + 1][0], a.trail[i + 1][1]); ctx.stroke();
      }
      ctx.restore();
      if (a.st) extraLights.push({ x: a.x, y: a.y, r: 70 + a.st * 40, c, a: 0.5 * al });
    }
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.ang); drawArrowShape(a.len, a.st, al); ctx.restore();
  }
}

// charge visuals: motes, stage rings, the rune circle in front of the arrow, stage pips over the head
function drawBowFx() {
  const B = bow, t = performance.now() / 1000;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    const al = Math.min(1, m.life * 6) * (1 - m.life / 0.7);
    ctx.fillStyle = bowCol(m.st, al); ctx.beginPath(); ctx.arc(m.x, m.y, 1.5 + m.st * 0.4, 0, 6.283); ctx.fill();
  }

    const sw = (t / (player.hots.length ? 700 : 1400)) % 1, sx = BX + w(hp) * sw, a = player.hots.length ? 0.5 : player.regen < 1.5 ? 0.22 : player.regen < 2.1 ? 0.32 : 0.42;
    ctx.save(); ctx.beginPath(); ctx.rect(BX, BY, w(hp), BH); ctx.clip();
    const gl = ctx.createLinearGradient(sx - 40, 0, sx + 40, 0); gl.addColorStop(0, 'rgba(255,230,190,0)'); gl.addColorStop(0.5, `rgba(255,230,190,${a})`); gl.addColorStop(1, 'rgba(255,230,190,0)');
    ctx.fillStyle = gl; ctx.fillRect(sx - 40, BY, 80, BH); ctx.restore();
    ctx.fillStyle = `rgba(255,230,190,${0.5 + 0.3 * Math.sin(t / 200)})`; ctx.fillRect(BX + w(hp) - 1, BY - 1, 2, BH + 2);   // the bar's growing edge
  }
  if (low) { ctx.fillStyle = `rgba(255,80,60,${0.08 + 0.08 * Math.sin(t / 220)})`; ctx.fillRect(BX, BY, w(hp), BH); }
  if (player.hurtT > 0.25) { ctx.fillStyle = 'rgba(255,230,200,0.35)'; ctx.fillRect(BX, BY, w(hp), BH); }
  // gold hairline frame with diamond end-caps
  ctx.strokeStyle = GOLD; ctx.lineWidth = 1; ctx.strokeRect(BX - 2.5, BY - 2.5, BW + 5, BH + 5);
  ctx.strokeStyle = 'rgba(156,133,80,0.3)'; ctx.beginPath(); ctx.moveTo(BX + 10, BY + BH + 7); ctx.lineTo(BX + BW * 0.45, BY + BH + 7); ctx.stroke();
  const diamond = (cx, cy, s) => { ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI / 4); ctx.fillRect(-s, -s, s * 2, s * 2); ctx.restore(); };
  ctx.fillStyle = GOLD; diamond(BX + BW + 5, BY + BH / 2, 3.2);
  // link from the medallion to the bar
  ctx.strokeStyle = GOLD; ctx.beginPath(); ctx.moveTo(PX + PR + 3, BY + BH / 2); ctx.lineTo(BX - 3, BY + BH / 2); ctx.stroke();
  // numbers, small and quiet
  ctx.font = font(11); ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  try { ctx.letterSpacing = '1px'; } catch (e) {}
  ctx.fillStyle = low ? 'rgba(220,120,100,0.9)' : 'rgba(217,206,178,0.7)';
  ctx.fillText(`${Math.ceil(hp)} / ${mx}`, BX + BW, BY + BH + 6);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  // portrait medallion: dark, desaturated, framed in gold
  ctx.fillStyle = '#080706'; ctx.beginPath(); ctx.arc(PX, PY, PR + 4, 0, 6.283); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(PX, PY, PR, 0, 6.283); ctx.clip();
  ctx.fillStyle = '#1b1814'; ctx.fillRect(PX - PR, PY - PR, PR * 2, PR * 2);
  ctx.translate(PX + 1, PY + 4); ctx.scale(1.4, 1.4); ctx.translate(0, 38);
  drawHeroHead(1, false, t, 0);
  ctx.setTransform(DPR, 0, 0, DPR, jx * DPR, jy * DPR);
  ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = 'rgba(128,128,128,0.6)'; ctx.fillRect(PX - PR, PY - PR, PR * 2, PR * 2);
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(PX, PY - 4, PR * 0.3, PX, PY, PR);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vg; ctx.fillRect(PX - PR, PY - PR, PR * 2, PR * 2);
  if (player.hurtT > 0) { ctx.fillStyle = `rgba(150,20,15,${player.hurtT / 0.4 * 0.55})`; ctx.fillRect(PX - PR, PY - PR, PR * 2, PR * 2); }
  ctx.restore();
  ctx.strokeStyle = low ? `rgba(170,50,40,${0.7 + 0.3 * Math.sin(t / 220)})` : GOLD; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(PX, PY, PR + 1.5, 0, 6.283); ctx.stroke();
  ctx.strokeStyle = 'rgba(156,133,80,0.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(PX, PY, PR + 5, 0, 6.283); ctx.stroke();
  ctx.fillStyle = GOLD; diamond(PX, PY - PR - 5, 2.6); diamond(PX, PY + PR + 5, 2.6);
  ctx.restore();
}

// dusk lighting: a small light map (dark base + additive lights), multiplied over the scene
const lightC = document.createElement('canvas'), lg = lightC.getContext('2d'), LS = 4;
const extraLights = [];   // {x, y, r, c:[r,g,b], a} in world space, refilled every frame
function drawLightMap() {
  const lw = Math.ceil(W / LS), lh = Math.ceil(H / LS);
  if (lightC.width !== lw || lightC.height !== lh) { lightC.width = lw; lightC.height = lh; }
  const toS = (wx, wy) => [((wx - player.x) * camZoom + W / 2) / LS, ((wy - player.y) * camZoom + H / 2) / LS];
  lg.globalCompositeOperation = 'source-over'; lg.fillStyle = area === 2 ? 'rgb(40,36,60)' : 'rgb(50,44,74)'; lg.fillRect(0, 0, lw, lh);
  lg.globalCompositeOperation = 'lighter';
  const add = (sx, sy, r0, r1, stops) => {
    const gr = lg.createRadialGradient(sx, sy, r0, sx, sy, r1);
    for (const [k, c] of stops) gr.addColorStop(k, c);
    lg.fillStyle = gr; lg.fillRect(sx - r1, sy - r1, r1 * 2, r1 * 2);
  };
  add(lw / 2, lh / 2, 90 * camZoom / LS, 760 * camZoom / LS, [[0, 'rgb(180,170,150)'], [0.5, 'rgb(74,70,72)'], [1, 'rgb(0,0,0)']]);
  const t = performance.now(), R = 300 * camZoom / LS;
  for (const o of props) if (o.k === 'lamp') {
    const [sx, sy] = toS(o.lx, o.ly + 40);
    if (sx < -R || sy < -R || sx > lw + R || sy > lh + R) continue;
    const f = lampFlicker(o, t);
    add(sx, sy, 0, R, [[0, `rgb(${210 * f | 0},${140 * f | 0},${60 * f | 0})`], [0.35, `rgb(${110 * f | 0},${62 * f | 0},${24 * f | 0})`], [1, 'rgb(0,0,0)']]);
  }
  for (const L of extraLights) {
    const [sx, sy] = toS(L.x, L.y), r = L.r * camZoom / LS;
    add(sx, sy, 0, r, [[0, `rgba(${L.c[0]},${L.c[1]},${L.c[2]},${L.a})`], [1, 'rgba(0,0,0,0)']]);
  }
  extraLights.length = 0;
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = 1 - Math.max(flash * 0.8, player.thunder && player.thunder.ph > 0 ? 0.45 : 0);
  ctx.drawImage(lightC, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function draw() {
  ctx.fillStyle = '#20180e';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(camZoom, camZoom);
  ctx.translate(-player.x + (Math.random() - 0.5) * shake * 14, -player.y + (Math.random() - 0.5) * shake * 14);

  if (area === 3) { drawTiledGround(false); drawLakeLife(); } else ctx.drawImage(ground, 0, 0);
  drawBWalls(player.y - H / (2 * camZoom), player.y + H / (2 * camZoom));
  drawGround_Splats();
  drawCraters();
  drawSlamsUnder();
  drawFuses();
  drawSuperGround();
  drawFireGround();
  drawBossTelegraphs();
  for (const z of zombies) if (z.atk && !z.dying && z.atk.ph < 2) drawTelegraph(z); else if (z.type === 'beast' && z.bk && !z.dying) drawBeastTelegraph(z);

  const hw = W / (2 * camZoom) + 140, hh = H / (2 * camZoom) + 140;
  const items = [];
  for (const f of fences) items.push({ y: f.y + f.h, f });
  for (const o of props) if (Math.abs(o.x - player.x) < hw && o.y > player.y - hh && o.y < player.y + hh + 140) items.push({ y: o.y, o });
  for (const z of zombies) items.push({ y: z.y + (z.type === 'boss' ? 60 : 20), z });
  for (const f of fallers) items.push({ y: f.o.y, fl: f });
  if (area === 1) for (const it of groundItems) items.push({ y: it.y, gi: it });
  for (const d of drops) if (d.area === area) items.push({ y: d.y, db: d });
  if (chest && area === 2) items.push({ y: chest.y, ch: chest });
  items.sort((a, b) => a.y - b.y);
  const feet = player.y + 20;
  const drawIt = it => it.ch ? drawChest(it.ch) : it.f ? drawFence(it.f) : it.z ? (drawZombie(it.z), drawBurnOn(it.z), drawZapOn(it.z)) : it.fl ? drawFaller(it.fl) : it.gi ? drawGroundItem(it.gi) : it.db ? drawDropBag(it.db) : drawProp(it.o);
  for (const it of items) if (it.y < feet) drawIt(it);
  drawFxUnder();
  drawPlayer();
  for (const it of items) if (it.y >= feet) drawIt(it);
  drawParts();
  drawBlasts();
  drawLevs();
  drawDebris();
  drawGlobs();
  drawBoulders();
  drawArrows();
  drawFireballs();
  drawFireBlasts();
  drawZaps();
  drawBeams();
  drawZapCharge();
  drawFxOver();
  drawLeaves();

  ctx.restore();

  drawLightMap();
  if (dim > 0.01) { ctx.fillStyle = `rgba(8,8,30,${dim})`; ctx.fillRect(0, 0, W, H); }
  if (flash > 0) { ctx.fillStyle = `rgba(255,240,170,${flash * 0.55})`; ctx.fillRect(0, 0, W, H); }
  if (whiteout > 0) { ctx.fillStyle = `rgba(255,252,235,${Math.min(1, whiteout)})`; ctx.fillRect(0, 0, W, H); }
  applyWarp();
  {   // red edges when hit, slow pulse when low on health
    const low = player.hp / player.maxHp < 0.3 ? 0.16 + 0.1 * Math.sin(performance.now() / 180) : 0;
    const v = Math.max(player.hurtT / 0.4 * 0.55, low);
    if (v > 0.01) {
      const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.72);
      gr.addColorStop(0, 'rgba(190,0,10,0)'); gr.addColorStop(1, `rgba(190,0,10,${v})`);
      ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    }
  }

  if (joy.on) {
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, joy.R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 30, 0, Math.PI * 2); ctx.fill();
  }
  drawBossBar();
  for (const b of btns()) drawButton(b);
  drawQuickBar();
  drawBag();
  drawSkillTreeBtn();
  drawAbilitiesBtn();
  drawLootButton();

  drawHealth();
  drawKills();
  drawGold();
  drawAreaHud();
  drawLootPanel();
  drawFade();
  drawBanners(frameDt);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(217,206,178,0.45)'; ctx.font = '12px Georgia, serif';
  ctx.fillText('placeholder prototype', 20, H - 20);
}

// ---------- Saving ----------
// progress autosaves in this browser every few seconds (and whenever the app is closed or hidden), and loads on start.
// Settings > Export save writes it to a file you can send to someone; Import save on their device loads that file.
// Saved: gold, kills, inventory and what's in each hand, which weapon is out, which ability is equipped, health,
// shop prices, and which area you were in (you arrive at that area's entrance). Not saved: waves in progress, sacks on the ground.
const SAVE_KEY = 'rpgSave';
function saveData() {
  return { v: 1, at: Date.now(), gold, kills, hp: Math.max(1, Math.round(player.hp)), area, weapon: player.weapon, ability,
           has: Object.assign({}, player.has), inv: JSON.parse(JSON.stringify(inv)), sold: Object.assign({}, sold) };
}
function saveGame() {
  if (fade) return;   // mid-travel: wait for the next one
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData())); } catch (e) {}
  updateSavedAt();
}
function updateSavedAt() { const el = document.getElementById('savedat'); if (el) el.textContent = 'autosaved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
function applySave(d) {
  if (!d || d.v !== 1 || !d.inv) throw new Error('not a save file from this game');
  const fill = (arr, src) => { for (let i = 0; i < arr.length; i++) arr[i] = src && src[i] !== undefined ? src[i] : null; };
  fill(inv.quick, d.inv.quick); fill(inv.bag, d.inv.bag);
  for (const k of EQ_SLOTS) inv.eq[k] = (d.inv.eq && d.inv.eq[k]) || null;
  gold = d.gold | 0; goldHud.shown = goldHud.from = gold; goldHud.t = 1; kills = d.kills | 0;
  Object.assign(player.has, d.has || {});
  for (const k in sold) delete sold[k]; Object.assign(sold, d.sold || {});
  ability = d.ability === 'bolt' ? 'bolt' : 'fire';
  const owned = k => !!player.has[k] || JSON.stringify(inv).includes('"' + k + '"');
  for (let i = groundItems.length - 1; i >= 0; i--) if (owned(groundItems[i].k)) groundItems.splice(i, 1);   // already picked up
  player.weapon = d.weapon && d.weapon !== 'fists' && heldIn(d.weapon) ? d.weapon : 'fists'; fixWeapon();
  blade.out = false; blade.len = SW_SHEATH; bow.charge = -1;
  const a = [1, 2, 3].includes(d.area) ? d.area : 1;
  if (a !== area || a !== 1) loadArea(a, a === 2 ? A2_ARRIVE : a === 3 ? WL_ARRIVE : SPAWN1);
  player.hp = Math.min(player.maxHp, Math.max(1, d.hp || player.maxHp)); hud.chip = player.hp;
}
function loadGame() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (!d) return;
  try { applySave(d); } catch (e) { return; }
}
function note(text) { msg.textContent = text; msg.style.display = 'block'; clearTimeout(note.t); note.t = setTimeout(() => msg.style.display = 'none', 3500); }
document.getElementById('exportsave').addEventListener('click', async () => {
  saveGame();
  const json = JSON.stringify(saveData()), name = 'rpg-save-' + new Date().toISOString().slice(0, 10) + '.json';
  try {   // on a phone: the share sheet, so it can go straight into a chat; elsewhere: a download
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'RPG save' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  note('Save exported: ' + name);
});
const saveFile = document.getElementById('savefile');
document.getElementById('importsave').addEventListener('click', () => { saveFile.value = ''; saveFile.click(); });
saveFile.addEventListener('change', async () => {
  const f = saveFile.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    applySave(d); saveGame(); panel.style.display = 'none';
    note('Save loaded.');
  } catch (e) { note("Couldn't load that file: " + (e.message || e)); }
});
document.getElementById('newgame').addEventListener('click', () => {
  if (!confirm('Start a new game? Your current progress on this device will be erased (export it first if you want to keep it).')) return;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  addEventListener('pagehide', () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} });
  location.reload();
});
loadGame();
setInterval(saveGame, 5000);
addEventListener('pagehide', saveGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

camZoom = zoom;
unstick(player);
let last = performance.now(), frameDt = 0;
function loop(t) {
  requestAnimationFrame(loop);
  try { frame(t); } catch (e) { showError(e); }
}
function frame(t) {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  const th2 = player.thunder && player.thunder.st2;   // stage-2 super pulls the view back a little
  camZoom += (zoom * (player.weapon === 'bow' ? 0.74 : 1) * (th2 ? 0.84 : 1) - camZoom) * Math.min(1, dt * (th2 ? 2.5 : 3.5));   // see further with the bow
  frameDt = dt;
  updateFade(dt);
  if (!paused) {
    const sdt = slowT > 0 ? dt * 0.3 : dt; slowT -= dt;   // slow-motion after the boss falls
    if (hitstop > 0) { hitstop -= dt; update(sdt * 0.06); } else update(sdt);
  }   // brief freeze on hit
  draw();
}
requestAnimationFrame(loop);
</script>
</body>
